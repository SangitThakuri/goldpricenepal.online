name: Update Gold Prices

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-prices:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch and persist FENEGOSIDA prices
        run: |
          # FENEGOSIDA migrated to a React SPA — prices now served via REST API
          python3 << 'PYEOF'
          import json, urllib.request, subprocess, sys, os
          from datetime import datetime, timezone

          url = "https://api.fenegosida.org/api/website/v1/Dashboard/today"
          req = urllib.request.Request(url, headers={
              "User-Agent": "Mozilla/5.0 (compatible; GoldPriceNepal/1.0)",
              "Origin": "https://fenegosida.org",
              "Referer": "https://fenegosida.org/",
          })

          try:
              with urllib.request.urlopen(req, timeout=20) as r:
                  data = json.loads(r.read())
          except Exception as e:
              print(f"FENEGOSIDA API fetch failed: {e} — keeping existing data unchanged")
              sys.exit(0)

          gold = silver = 0
          for item in data:
              rt  = item.get("rateType", "")
              val = int(item.get("todayBaseRatePerGram", 0) or 0)
              # "सुन" = gold, "चाँदी" = silver, "१ तोला" = 1 tola
              if "सुन" in rt and "१ तोला" in rt:
                  gold = val
              elif "चाँदी" in rt and "१ तोला" in rt:
                  silver = val

          if not gold:
              print("No gold price in API response — skipping update")
              sys.exit(0)

          print(f"Fetched: gold={gold}, silver={silver}")

          now = datetime.now(timezone.utc)
          env = {
              **os.environ,
              "GOLD":      str(gold),
              "SILVER":    str(silver),
              "DATE":      now.strftime("%Y-%m-%d"),
              "TIMESTAMP": now.strftime("%Y-%m-%dT%H:%M:%SZ"),
          }
          subprocess.run(["python3", ".github/scripts/update_prices.py"], env=env, check=True)
          PYEOF

      - name: Fetch exchange rates server-side
        run: |
          curl -s \
            "https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/usd.json" \
            -H "User-Agent: Mozilla/5.0 (compatible; GoldPriceNepal/1.0)" \
            --max-time 30 \
            -o /tmp/rates_raw.json || echo "{}" > /tmp/rates_raw.json
          python3 .github/scripts/update_rates.py

      - name: Commit updated data
        id: commit
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add data/prices.json data/history.json data/rates.json
          if git diff --staged --quiet; then
            echo "No data changes — skipping commit and push"
            echo "changed=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          git commit -m "chore: update gold prices $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push
          echo "changed=true" >> $GITHUB_OUTPUT

      - name: Deploy to Cloudflare (push updated prices live)
        if: steps.commit.outputs.changed == 'true'
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Purge Cloudflare cache
        if: steps.commit.outputs.changed == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          ZONE_ID=$(curl -s "https://api.cloudflare.com/client/v4/zones?name=goldpricenepal.online" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['result'][0]['id'])")
          curl -s -X POST "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/purge_cache" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'
          echo "Cache purged"
